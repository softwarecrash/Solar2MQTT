name: Build M5Stack ATOM Lite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: atom-lite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Read firmware version
        run: |
          VER="$(awk -F' = ' '/^custom_source_version =/{print $2; exit}' platformio.ini)"
          test -n "$VER"
          echo "FW_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Firmware version: $VER"
      - name: Build ATOM Lite
        run: pio run -e m5stack_atom_lite
      - name: Verify firmware artifacts
        run: |
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin.ota"
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin"
          ls -lh .firmware/
      - name: Upload firmware to GitHub Release
        # Every non-PR build of main must refresh the current-version assets.
        # This is important for corrected rebuilds that intentionally keep the
        # same firmware version/tag (for example 2.0.18H).
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${FW_VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Solar2MQTT ${FW_VERSION}" \
            --target "${{ github.sha }}" \
            --notes-file release.md
          gh release delete-asset "$TAG" "Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin.ota" -y 2>/dev/null || true
          gh release delete-asset "$TAG" "Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin" -y 2>/dev/null || true
          gh release upload "$TAG" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin.ota" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V${FW_VERSION}.bin"
      - name: Hide broken releases but preserve tags and history
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TAG in \
            v0.0.0-dev-2.0.14X \
            v0.0.0-dev-2.0.14Y \
            v0.0.0-dev-2.0.14Z \
            v0.0.0-dev-2.0.15 \
            v0.0.0-dev-2.0.16 \
            v0.0.0-dev-2.0.17
          do
            gh release delete "$TAG" -y 2>/dev/null || true
          done
          echo "Broken release objects hidden; git tags/commits preserved."
      - uses: actions/upload-artifact@v4
        with:
          name: Solar2MQTT-m5stack-atom-lite
          path: |
            .firmware/Solar2MQTT_m5stack_atom_lite_V${{ env.FW_VERSION }}.bin.ota
            .firmware/Solar2MQTT_m5stack_atom_lite_V${{ env.FW_VERSION }}.bin
          if-no-files-found: error
